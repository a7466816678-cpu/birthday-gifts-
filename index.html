<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
      color: #333;
      overflow-x: hidden;
      position: relative;
      padding: 20px;
    }

    /* Floating background emojis */
    .bg-shape {
      position: absolute;
      opacity: 0.25;
      animation: float 6s ease-in-out infinite;
      user-select: none;
      pointer-events: none;
    }

    .shape1 { top: 10%; left: 8%; font-size: 2rem; animation-delay: 0s; }
    .shape2 { top: 15%; right: 10%; font-size: 2.5rem; animation-delay: 1.5s; }
    .shape3 { bottom: 12%; left: 10%; font-size: 2.2rem; animation-delay: 3s; }
    .shape4 { bottom: 15%; right: 12%; font-size: 2.8rem; animation-delay: 4.5s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(10deg); }
    }

    /* Card Styling */
    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding: 2.5rem 2rem;
      border-radius: 24px;
      text-align: center;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
      position: relative;
      z-index: 10;
      transition: transform 0.3s ease;
    }

    .icon-wrapper {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      display: inline-block;
      animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-15px); }
      60% { transform: translateY(-7px); }
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #ff477e;
      margin-bottom: 0.25rem;
    }

    .name {
      font-size: 1.6rem;
      color: #7952b3;
      font-weight: 600;
      margin-bottom: 1.25rem;
    }

    p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #555;
      margin-bottom: 2rem;
    }

    /* Wish Button */
    .btn {
      background: linear-gradient(135deg, #ff4b72, #ff758c);
      color: #fff;
      border: none;
      padding: 0.9rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 75, 114, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      width: 100%;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(255, 75, 114, 0.45);
    }

    .btn:active {
      transform: scale(0.97);
    }

    /* Hidden audio element (Optional sound) */
    audio {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Floating Ambient Decorations -->
  <div class="bg-shape shape1">🎈</div>
  <div class="bg-shape shape2">✨</div>
  <div class="bg-shape shape3">🎁</div>
  <div class="bg-shape shape4">🍰</div>

  <!-- Birthday Card Container -->
  <main class="card">
    <div class="icon-wrapper">🎂</div>
    <h1>Happy Birthday!</h1>
    <div class="name">Dear Friend 🎉</div>
    <p>
      Wishing you a day filled with love, laughter, and endless joy. May the year ahead bring you success, health, and all the happiness in the world!
    </p>
    <button class="btn" id="celebrateBtn">Celebrate! 🎊</button>
  </main>

  <script>
    const celebrateBtn = document.getElementById('celebrateBtn');

    // Trigger initial gentle confetti on load
    window.addEventListener('load', () => {
      launchConfetti();
    });

    // Burst confetti when button is clicked
    celebrateBtn.addEventListener('click', () => {
      fireSideCannons();
    });

    function launchConfetti() {
      confetti({
        particleCount: 80,
        spread: 60,
        origin: { y: 0.7 }
      });
    }

    function fireSideCannons() {
      const end = Date.now() + 1.5 * 1000;
      const colors = ['#ff477e', '#ff758c', '#7952b3', '#ffd166', '#06d6a0'];

      (function frame() {
        confetti({
          particleCount: 4,
          angle: 60,
          spread: 55,
          origin: { x: 0, y: 0.75 },
          colors: colors
        });
        confetti({
          particleCount: 4,
          angle: 120,
          spread: 55,
          origin: { x: 1, y: 0.75 },
          colors: colors
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      }());
    }
  </script>
</body>
</html>
